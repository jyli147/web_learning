<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.min.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="bg">
      <div class="container">
        <header class="header">
          <div class="header__logo">
            <img src="../images/Logo.png" alt="logo" />
          </div>
          <nav>
            <ul class="header__nav">
              <li><a class="nav" href="#">Home</a></li>
              <li><a class="nav" href="#">Portfolio</a></li>
              <li><a class="nav" href="#">Skills</a></li>
              <li><a class="nav" href="#">About Me</a></li>
            </ul>
          </nav>
          <div class="header__info">
            <button type="button" id="withThemeToggle"></button>
            <a href="#">Contact me</a>
          </div>
        </header>
      </div>
      <main>
        <div class="container">
          <section class="hero">
            <div class="hero__left">
              <div class="hero__title">
                <h1>PRODUCT <br />DESIGNER</h1>
                <p>CRISTIAN MUÑOZ</p>
              </div>
              <div class="hero__contact">
                <a class="hero__contact-link" href="#">
                  <img src="./images/Instagram.png" alt="Instagram"
                /></a>
                <a class="hero__contact-link" href="#">
                  <img src="./images/Figma.png" alt="Figma"
                /></a>
                <a class="hero__contact-link" href="#">
                  <img src="./images/LinkedIn.png" alt="LinkedIn"
                /></a>
                <a class="hero__contact-link" href="#">
                  <img src="./images/Twitter.png" alt="Twitter"
                /></a>
                <a class="hero__contact-link" href="#">
                  <img src="./images/Telegram.png" alt="Telegram"
                /></a>
                <a class="hero__contact-link" href="#">
                  <img src="./images/Medium.png" alt="Medium"
                /></a>
              </div>

              <button class="hero__button" type="button">
                <p>Download Curriculum Vitae</p>
                <img src="./images/arrow-down.svg" alt="arrow" />
              </button>
            </div>
            <div class="hero__portal">
              <img src="./images/Portal.png" alt="Portal" />
            </div>
            <div class="hero__img">
              <img
                width="694px"
                height="778px"
                src="./images/hero-r.png"
                alt="Девушка"
              />
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="js/main.min.js"></script>
  </body>
</html>
